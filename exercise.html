<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IronPulse — Workouts</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #03070d;
      --card: #080f1a;
      --card2: #0a1525;
      --card3: #0d1d35;
      --cyan: #00fff7;
      --cyan2: #00c8f0;
      --blue: #004eff;
      --green: #00ff88;
      --orange: #ff8c00;
      --red: #ff3860;
      --text: #cce8f4;
      --muted: #c9eeff;
      --border: rgba(0, 255, 247, 0.1);
      --borderH: rgba(0, 255, 247, 0.45);
    }

    html,
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      overflow-x: hidden;
    }

    /* ═══ BG ═══ */
    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image: linear-gradient(rgba(0, 255, 247, .025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 247, .025) 1px, transparent 1px);
      background-size: 50px 50px;
    }

    .bg-glow {
      position: fixed;
      top: -20vh;
      left: 50%;
      transform: translateX(-50%);
      width: 100vw;
      height: 55vh;
      background: radial-gradient(ellipse, rgba(0, 78, 255, .12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ═══ NAVBAR ═══ */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(3, 7, 13, .92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 1.3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 58px;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
    }

    .nav-ico {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(145deg, #00c8f0, #004eff);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 14px rgba(0, 200, 240, .4);
    }

    .nav-ico svg {
      width: 17px;
      height: 17px;
      stroke: #fff;
      fill: none;
      stroke-width: 2.3;
      stroke-linecap: round;
    }

    .nav-brand {
      font-family: 'Orbitron', monospace;
      font-size: .85rem;
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(90deg, var(--cyan), #fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-back {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: .7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color .2s;
    }

    .nav-back:hover {
      color: var(--cyan);
    }

    .nav-back svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
    }

    /* ═══ MAIN ═══ */
    .main {
      position: relative;
      z-index: 1;
      padding: 1.3rem 1.1rem 5.5rem;
      max-width: 680px;
      margin: 0 auto;
    }

    /* ═══ PAGE HEADER (GSAP animated) ═══ */
    .page-head {
      margin-bottom: 1.4rem;
      opacity: 0;
      transform: translateY(-20px);
    }

    .page-tag {
      font-size: .6rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--cyan2);
      margin-bottom: .3rem;
    }

    .page-title {
      font-family: 'Orbitron', monospace;
      font-size: 1.5rem;
      font-weight: 900;
      color: #fff;
      margin-bottom: .25rem;
    }

    .page-sub {
      font-size: .85rem;
      color: var(--muted);
    }

    /* ═══ INTENSITY BADGE ═══ */
    .intensity-row {
      display: flex;
      align-items: center;
      gap: .7rem;
      margin-bottom: 1.2rem;
      padding: .7rem 1rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      opacity: 0;
    }

    .int-label {
      font-size: .62rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .int-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .int-beginner {
      background: rgba(0, 255, 136, .1);
      border: 1px solid rgba(0, 255, 136, .3);
      color: var(--green);
    }

    .int-intermediate {
      background: rgba(0, 200, 240, .1);
      border: 1px solid rgba(0, 200, 240, .3);
      color: var(--cyan2);
    }

    .int-advanced {
      background: rgba(255, 56, 96, .1);
      border: 1px solid rgba(255, 56, 96, .3);
      color: var(--red);
    }

    .int-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
      animation: blink 2s ease-in-out infinite;
    }

    .int-beginner-dot {
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
    }

    .int-intermediate-dot {
      background: var(--cyan2);
      box-shadow: 0 0 6px var(--cyan2);
    }

    .int-advanced-dot {
      background: var(--red);
      box-shadow: 0 0 6px var(--red);
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .3
      }
    }

    /* ═══ DAY TABS ═══ */
    .day-tabs {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: .32rem;
      margin-bottom: 1.2rem;
      opacity: 0;
    }

    .day-tab {
      border-radius: 12px;
      padding: .6rem .08rem .5rem;
      text-align: center;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--card);
      transition: all .25s;
      position: relative;
    }

    .day-tab:hover:not(.active) {
      border-color: var(--borderH);
      background: var(--card2);
    }

    .day-tab.active {
      border-color: var(--cyan);
      background: linear-gradient(180deg, rgba(0, 255, 247, .1), rgba(0, 255, 247, .03));
      box-shadow: 0 0 16px rgba(0, 255, 247, .14);
    }

    .day-tab.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 2px;
      background: var(--cyan);
      border-radius: 2px;
      box-shadow: 0 0 5px var(--cyan);
    }

    .day-tab.rest-tab.active {
      border-color: var(--orange);
      background: rgba(255, 140, 0, .06);
      box-shadow: 0 0 14px rgba(255, 140, 0, .15);
    }

    .day-tab.rest-tab.active::after {
      background: var(--orange);
      box-shadow: 0 0 5px var(--orange);
    }

    .dt-name {
      font-size: .46rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .day-tab.active .dt-name {
      color: var(--cyan);
      font-weight: 700;
    }

    .day-tab.rest-tab.active .dt-name {
      color: var(--orange);
    }

    .dt-ico {
      font-size: 1.2rem;
      line-height: 1;
    }

    .today-chip {
      display: block;
      font-size: .42rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--cyan);
      margin-top: 3px;
      opacity: .8;
    }

    /* ═══ WORKOUT HEADER ═══ */
    .wk-header {
      background: linear-gradient(135deg, rgba(0, 78, 255, .22), rgba(0, 200, 240, .06));
      border: 1px solid rgba(0, 200, 240, .18);
      border-radius: 18px;
      padding: 1.1rem 1.3rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .wk-focus {
      font-size: .58rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--cyan2);
      margin-bottom: .25rem;
    }

    .wk-name {
      font-family: 'Orbitron', monospace;
      font-size: .95rem;
      font-weight: 700;
      color: #fff;
    }

    .wk-stats {
      display: flex;
      gap: .75rem;
    }

    .wk-stat {
      text-align: center;
    }

    .wk-stat .wsv {
      font-family: 'Orbitron', monospace;
      font-size: .88rem;
      font-weight: 700;
      color: #fff;
    }

    .wk-stat .wsl {
      font-size: .52rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ═══ PROGRESS TRACKER ═══ */
    .prog-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.1rem 1.3rem;
      margin-bottom: 1rem;
    }

    .prog-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: .8rem;
    }

    .prog-title {
      font-size: .65rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }

    .prog-pct {
      font-family: 'Orbitron', monospace;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--cyan);
    }

    .prog-track {
      height: 6px;
      background: rgba(0, 255, 247, .07);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: .75rem;
    }

    .prog-fill {
      height: 100%;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--blue), var(--cyan));
      box-shadow: 0 0 10px rgba(0, 255, 247, .4);
      transition: width .6s cubic-bezier(.22, 1, .36, 1);
    }

    .prog-dots {
      display: flex;
      gap: .45rem;
      flex-wrap: wrap;
    }

    .prog-dot {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .7rem;
      color: var(--muted);
      transition: all .3s cubic-bezier(.34, 1.56, .64, 1);
      cursor: default;
    }

    .prog-dot.done {
      background: linear-gradient(135deg, #00aa55, var(--green));
      border-color: var(--green);
      color: #fff;
      box-shadow: 0 0 10px rgba(0, 255, 136, .35);
      transform: scale(1.1);
    }

    /* ═══ SECTION LABEL ═══ */
    .sec {
      font-size: .62rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      margin: 1.2rem 0 .72rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: .6rem;
    }

    .sec::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border), transparent);
    }

    /* ═══ EXERCISE CARDS ═══ */
    .ex-list {
      display: flex;
      flex-direction: column;
      gap: .6rem;
    }

    .ex-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      opacity: 0;
      transform: translateY(30px);
      transition: border-color .25s, box-shadow .25s, transform .25s;
    }

    .ex-card:hover {
      border-color: var(--borderH);
      transform: translateY(-2px) !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }

    .ex-card.completed {
      border-color: rgba(0, 255, 136, .3);
      background: rgba(0, 255, 136, .025);
    }

    .ex-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, var(--blue), var(--cyan));
      opacity: 0;
      transition: opacity .25s;
      border-radius: 3px 0 0 3px;
    }

    .ex-card:hover::before {
      opacity: 1;
    }

    .ex-card.completed::before {
      background: linear-gradient(180deg, #00aa55, var(--green));
      opacity: 1;
    }

    .ex-inner {
      display: flex;
      align-items: center;
      gap: .85rem;
      padding: .88rem .95rem;
    }

    .ex-num {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--blue), var(--cyan2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', monospace;
      font-size: .62rem;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 0 10px rgba(0, 200, 240, .3);
      transition: background .3s;
    }

    .ex-card.completed .ex-num {
      background: linear-gradient(135deg, #00aa55, var(--green));
      box-shadow: 0 0 10px rgba(0, 255, 136, .35);
    }

    .ex-info {
      flex: 1;
      min-width: 0;
    }

    .ex-name {
      font-size: .92rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
      transition: color .2s;
    }

    .ex-card.completed .ex-name {
      color: var(--green);
    }

    .ex-meta {
      display: flex;
      gap: .6rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .ex-sets {
      font-size: .7rem;
      color: var(--muted);
    }

    .ex-muscle-tag {
      font-size: .57rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--cyan2);
      background: rgba(0, 200, 240, .08);
      padding: 2px 7px;
      border-radius: 5px;
      border: 1px solid rgba(0, 200, 240, .14);
    }

    .ex-cal {
      font-size: .65rem;
      color: var(--orange);
    }

    .ex-int-tag {
      font-size: .55rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 5px;
    }

    .ex-int-b {
      background: rgba(0, 255, 136, .08);
      color: var(--green);
      border: 1px solid rgba(0, 255, 136, .2);
    }

    .ex-int-i {
      background: rgba(0, 200, 240, .08);
      color: var(--cyan2);
      border: 1px solid rgba(0, 200, 240, .2);
    }

    .ex-int-a {
      background: rgba(255, 56, 96, .08);
      color: var(--red);
      border: 1px solid rgba(255, 56, 96, .2);
    }

    .ex-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: .4rem;
      flex-shrink: 0;
    }

    .done-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all .25s cubic-bezier(.34, 1.56, .64, 1);
      font-size: .8rem;
      color: var(--muted);
    }

    .done-btn:hover {
      border-color: var(--green);
      background: rgba(0, 255, 136, .1);
      color: var(--green);
      transform: scale(1.15);
    }

    .ex-card.completed .done-btn {
      background: var(--green);
      border-color: var(--green);
      color: #000;
    }

    .ex-arr {
      color: var(--muted);
      font-size: .9rem;
      transition: color .2s, transform .2s;
    }

    .ex-card:hover .ex-arr {
      color: var(--cyan);
      transform: translateX(3px);
    }

    /* ═══ REST DAY ═══ */
    .rest-screen {
      text-align: center;
      padding: 2.5rem 1rem;
      opacity: 0;
      transform: translateY(20px);
    }

    .rest-screen .ri {
      font-size: 3.5rem;
      margin-bottom: 1rem;
    }

    .rest-screen .rt {
      font-family: 'Orbitron', monospace;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--orange);
      margin-bottom: .5rem;
    }

    .rest-screen .rd {
      font-size: .88rem;
      color: var(--muted);
      line-height: 1.7;
      max-width: 290px;
      margin: 0 auto 1.5rem;
    }

    .rest-tips {
      display: flex;
      flex-direction: column;
      gap: .6rem;
      max-width: 310px;
      margin: 0 auto;
      text-align: left;
    }

    .rest-tip {
      display: flex;
      gap: .75rem;
      align-items: flex-start;
      font-size: .84rem;
      color: var(--muted);
      line-height: 1.5;
      padding: .7rem .9rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      opacity: 0;
    }

    /* ═══ DONE BANNER ═══ */
    .done-banner {
      display: none;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, rgba(0, 170, 85, .18), rgba(0, 255, 136, .04));
      border: 1px solid rgba(0, 255, 136, .3);
      border-radius: 16px;
      padding: 1.1rem 1.4rem;
      text-align: center;
    }

    .done-banner.show {
      display: block;
      animation: popIn .5s cubic-bezier(.34, 1.56, .64, 1) both;
    }

    .db-ico {
      font-size: 2rem;
      margin-bottom: .4rem;
    }

    .db-title {
      font-family: 'Orbitron', monospace;
      font-size: .92rem;
      font-weight: 700;
      color: var(--green);
      margin-bottom: .25rem;
    }

    .db-sub {
      font-size: .82rem;
      color: var(--muted);
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(.8)
      }

      to {
        opacity: 1;
        transform: scale(1)
      }
    }

    /* ═══ BOTTOM NAV ═══ */
    .bnav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(6, 14, 24, .96);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: .55rem 0 .7rem;
    }

    .bn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      text-decoration: none;
      padding: .2rem .8rem;
    }

    .bn svg {
      width: 21px;
      height: 21px;
      stroke: var(--muted);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke .2s;
    }

    .bn span {
      font-size: .57rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      transition: color .2s;
    }

    .bn.active svg {
      stroke: var(--cyan);
      filter: drop-shadow(0 0 4px rgba(0, 255, 247, .5));
    }

    .bn.active span {
      color: var(--cyan);
    }

    /* ═══ DIALOG ═══ */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0, 0, 0, .78);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
    }

    .overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .dialog {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 680px;
      max-height: 90vh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform .38s cubic-bezier(.22, 1, .36, 1);
      position: relative;
    }

    .overlay.open .dialog {
      transform: translateY(0);
    }

    .dlg-handle {
      width: 38px;
      height: 4px;
      border-radius: 4px;
      background: var(--borderH);
      margin: 12px auto 0;
    }

    .dlg-close {
      position: absolute;
      top: .9rem;
      right: 1.1rem;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--card2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: .9rem;
      color: var(--muted);
      transition: all .2s;
      z-index: 10;
    }

    .dlg-close:hover {
      background: rgba(255, 60, 80, .15);
      border-color: rgba(255, 60, 80, .4);
      color: #ff6080;
    }

    .dlg-img-wrap {
      margin: 1rem 1.2rem 0;
      border-radius: 14px;
      overflow: hidden;
      background: var(--card2);
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .dlg-img-wrap img {
      height: 100%;
      width: 100%;
      object-fit: contain;
    }

    .dlg-img-wrap::after {
      content: '';
      position: absolute;
      inset: 0;

      gap: .75rem;

        { name: 'Diamond Push-Ups', baseSets: '3', baseReps: '15', muscle: 'Triceps', cal: 55, diff: 'mid', steps: ['Diamond shape thumbs and index fingers.', 'Lower chest to hands, elbows close.', 'Push up, fully extend arms.', 'Straight body throughout.'], tips: ['Narrower = more tricep isolation.', '3s down, 1s up for tension.', 'Elevate feet to advance.'] },
        { name: 'Crunches', baseSets: '4', baseReps: '25', muscle: 'Abs', cal: 40, diff: 'low', steps: ['Back flat, knees bent, hands behind head.', 'Curl shoulders toward knees.', 'Hold peak 1 second.', 'Slow descent — don\'t fully relax.'], tips: ['Hands support head — don\'t pull neck.', 'Exhale hard at top of every rep.', 'Slow beats fast every time.'] }
      ]
    };

    var today = new Date().getDay();
    var activeDay = today === 0 ? 1 : today;
    var bodyType = localStorage.getItem('ip_body') || 'average';
    var completed = {};
    var currentDlgIdx = -1;
    var INT = INTENSITY[bodyType] || INTENSITY['average'];

    function getExercises(day) {
      var base = BASE_EX[day];
      if (!base) return [];
      return base.map(function (ex) {
        var sets = INT.sets[ex.diff] || INT.sets.mid;
        var reps = ex.baseReps.indexOf('s') > -1 ? ex.baseReps : INT.reps[ex.diff] || INT.reps.mid;
        return {
          name: ex.name,
          sets: sets + ' × ' + reps,
          muscle: ex.muscle,
          cal: Math.round(ex.cal * (bodyType === 'muscular' ? 1.2 : bodyType === 'skinny' ? .85 : 1)),
          diff: ex.diff,
          steps: ex.steps,
          tips: ex.tips
        };
      });
    }

    const SUPABASE_URL = 'https://vwqogdtowvfdqiknkmvg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3cW9nZHRvd3ZmZHFpa25rbXZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMTY2NTEsImV4cCI6MjA5NDY5MjY1MX0.ZiVg002fi-nn8ae7qWAEmHaPWejRhRdPIsJ7NfI9rfE';

    document.addEventListener('DOMContentLoaded', async function () {
      try {
        const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm');
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const { data: { user } } = await supabase.auth.getUser();
        if (user) {
          const { data: profile } = await supabase.from('profiles').select('body_type').eq('id', user.id).single();
          if (profile && profile.body_type) {
            bodyType = profile.body_type;
            localStorage.setItem('ip_body', bodyType);
            INT = INTENSITY[bodyType] || INTENSITY['average'];
          }
        }
      } catch (err) { console.log(err); }

      document.getElementById('intBadge').textContent = INT.label;
      document.getElementById('intBadge').className = 'int-badge ' + INT.cls;
      document.getElementById('intDot').className = 'int-dot ' + INT.dotCls;
      document.getElementById('intDesc').textContent = INT.rest;

      buildTabs();
      selectDay(activeDay);
      runEntryAnimations();
    });

    function runEntryAnimations() {
      var tl = gsap.timeline();
      tl.to('#pageHead', { opacity: 1, y: 0, duration: .6, ease: 'power3.out' })
        .to('#intRow', { opacity: 1, duration: .5, ease: 'power2.out' }, '-=.3')
        .to('.day-tabs', { opacity: 1, duration: .5, ease: 'power2.out' }, '-=.2');
    }

    function animateCards() {
      ScrollTrigger.getAll().forEach(function (t) { t.kill(); });
      gsap.utils.toArray('.ex-card').forEach(function (card, i) {
        gsap.fromTo(card,
          { opacity: 0, y: 35, scale: .97 },
          {
            opacity: 1, y: 0, scale: 1,
            duration: .55,
            delay: i * 0.07,
            ease: 'power3.out',
            scrollTrigger: { trigger: card, start: 'top 92%', toggleActions: 'play none none none' }
          }
        );
      });
      gsap.fromTo('#wkHeaderCard', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: .5, ease: 'power3.out' });
      gsap.fromTo('#progCard', { opacity: 0, scale: .95 }, { opacity: 1, scale: 1, duration: .5, ease: 'back.out(1.4)' });
    }

    function animateRestDay() {
      ScrollTrigger.getAll().forEach(function (t) { t.kill(); });
      gsap.to('.rest-screen', { opacity: 1, y: 0, duration: .6, ease: 'power3.out' });
      gsap.utils.toArray('.rest-tip').forEach(function (el, i) {
        gsap.to(el, { opacity: 1, duration: .4, delay: .3 + i * .12, ease: 'power2.out' });
      });
    }

    function buildTabs() {
      var SHORT = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
      var ICONS = ['😴', '💪', '🏋️', '🦵', '🔥', '⚡', '💥'];
      var html = '';
      for (var i = 0; i < 7; i++) {
        var restCls = i === 0 ? ' rest-tab' : '';
        var chip = i === today ? '<span class="today-chip">TODAY</span>' : '';
        html += '<div class="day-tab' + restCls + '" id="tab' + i + '" onclick="selectDay(' + i + ')">';
        html += '<div class="dt-name">' + SHORT[i] + '</div>';
        html += '<div class="dt-ico">' + ICONS[i] + '</div>';
        html += chip + '</div>';
      }
      document.getElementById('dayTabs').innerHTML = html;
    }

    function selectDay(day) {
      activeDay = day;
      for (var i = 0; i < 7; i++) {
        var t = document.getElementById('tab' + i);
        if (t) t.classList.toggle('active', i === day);
      }
      var s = SCH[day];
      document.getElementById('pageSub').textContent = s.name + ' — ' + s.focus;
      document.getElementById('doneBanner').classList.remove('show');

      if (s.rest) renderRestDay();
      else renderWorkout(day);
    }

    function renderWorkout(day) {
      var s = SCH[day];
      var exs = getExercises(day);
      if (!completed[day]) completed[day] = {};

      var totalCal = exs.reduce(function (a, e) { return a + e.cal; }, 0);
      var totalMin = exs.length * (bodyType === 'muscular' ? 10 : bodyType === 'skinny' ? 6 : 8);

      var html = '';
      html += '<div id="wkHeaderCard" style="opacity:0;">';
      html += '<div style="background:linear-gradient(135deg,rgba(0,78,255,.22),rgba(0,200,240,.06));border:1px solid rgba(0,200,240,.18);border-radius:18px;padding:1.1rem 1.3rem;margin-bottom:.9rem;display:flex;align-items:center;justify-content:space-between;">';
      html += '<div><div style="font-size:.58rem;letter-spacing:3px;text-transform:uppercase;color:var(--cyan2);margin-bottom:.25rem;">' + s.focus + '</div>';
      html += '<div style="font-family:\'Orbitron\',monospace;font-size:\.95rem;font-weight:700;color:#fff;">' + s.name + '</div></div>';
      html += '<div style="display:flex;gap:.75rem;">';
      html += '<div style="text-align:center;"><div style="font-family:\'Orbitron\',monospace;font-size:.88rem;font-weight:700;color:#fff;">' + exs.length + '</div><div style="font-size:.52rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);">Exercises</div></div>';
      html += '<div style="text-align:center;"><div style="font-family:\'Orbitron\',monospace;font-size:.88rem;font-weight:700;color:#fff;">~' + totalMin + 'm</div><div style="font-size:.52rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);">Duration</div></div>';
      html += '<div style="text-align:center;"><div style="font-family:\'Orbitron\',monospace;font-size:.88rem;font-weight:700;color:#fff;">' + totalCal + '</div><div style="font-size:.52rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);">Kcal</div></div>';
      html += '</div></div></div>';

      var doneCount = Object.values(completed[day] || {}).filter(Boolean).length;
      var pct = exs.length > 0 ? Math.round(doneCount / exs.length * 100) : 0;
      html += '<div id="progCard" style="opacity:0;">';
      html += '<div style="background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.1rem 1.3rem;margin-bottom:.9rem;">';
      html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem;">';
      html += '<div style="font-size:.63rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);font-weight:700;">Session Progress</div>';
      html += '<div style="font-family:\'Orbitron\',monospace;font-size:1.05rem;font-weight:700;color:var(--cyan);">' + pct + '%</div>';
      html += '</div>';
      html += '<div style="height:6px;background:rgba(0,255,247,.07);border-radius:6px;overflow:hidden;margin-bottom:.75rem;">';
      html += '<div id="progFill" style="height:100%;width:' + pct + '%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:6px;box-shadow:0 0 10px rgba(0,255,247,.4);transition:width .6s cubic-bezier(.22,1,.36,1);"></div>';
      html += '</div>';
      html += '<div style="display:flex;gap:.45rem;flex-wrap:wrap;" id="progDots">';
      for (var d = 0; d < exs.length; d++) {
        var isDone = completed[day][d];
        var dotCls = isDone ? 'prog-dot done' : 'prog-dot';
        html += '<div class="' + dotCls + '">' + (isDone ? '✓' : (d + 1)) + '</div>';
      }
      html += '</div></div></div>';

      html += '<div style="font-size:.62rem;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin:.9rem 0 .72rem;font-weight:700;display:flex;align-items:center;gap:.6rem;">Exercises<div style="flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent);"></div></div>';
      html += '<div class="ex-list">';
      exs.forEach(function (ex, i) {
        var isDone = completed[day][i];
        var cardCls = 'ex-card' + (isDone ? ' completed' : '');
        var intCls = INT.exCls;
        html += '<div class="' + cardCls + '" id="excard' + i + '">';
        html += '<div class="ex-inner" onclick="openDlg(' + i + ',' + day + ')">';
        html += '<div class="ex-num">' + (isDone ? '✓' : String(i + 1).padStart(2, '0')) + '</div>';
        html += '<div class="ex-info">';
        html += '<div class="ex-name">' + ex.name + '</div>';
        html += '<div class="ex-meta">';
        html += '<span class="ex-sets">' + ex.sets + '</span>';
        html += '<span class="ex-muscle-tag">' + ex.muscle + '</span>';
        html += '<span class="ex-cal">🔥 ~' + ex.cal + '</span>';
        html += '<span class="ex-int-tag ' + intCls + '">' + INT.exLabel + '</span>';
        html += '</div></div>';
        html += '<div class="ex-right">';
        html += '<button class="done-btn" onclick="toggleDone(event,' + i + ',' + day + ')">' + (isDone ? '✓' : '○') + '</button>';
        html += '<div class="ex-arr">›</div>';
        html += '</div>';
        html += '</div></div>';
      });
      html += '</div>';

      document.getElementById('dynamicArea').innerHTML = html;
      setTimeout(animateCards, 50);
    }

    function renderRestDay() {
      var html =
        '<div class="rest-screen">' +
        '<div class="ri">🛌</div>' +
        '<div class="rt">Rest & Recovery Day</div>' +
        '<div class="rd">Muscle growth happens during rest. This day is as important as any workout.</div>' +
        '<div class="rest-tips">' +
        '<div class="rest-tip"><span style="font-size:1rem;">💧</span>Drink at least 3 litres of water today.</div>' +
        '<div class="rest-tip"><span style="font-size:1rem;">🧘</span>15 minutes light stretching or yoga.</div>' +
        '<div class="rest-tip"><span style="font-size:1rem;">😴</span>Aim for 7–9 hours quality sleep tonight.</div>' +
        '<div class="rest-tip"><span style="font-size:1rem;">🥗</span>Keep nutrition on point even on rest days.</div>' +
        '</div></div>';
      document.getElementById('dynamicArea').innerHTML = html;
      setTimeout(animateRestDay, 50);
    }

    function toggleDone(e, idx, day) {
      e.stopPropagation();
      if (!completed[day]) completed[day] = {};
      completed[day][idx] = !completed[day][idx];
      renderWorkout(day);

      var exs = getExercises(day);
      var done = Object.values(completed[day]).filter(Boolean).length;
      if (done === exs.length && exs.length > 0) {
        document.getElementById('doneBanner').classList.add('show');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        document.getElementById('doneBanner').classList.remove('show');
      }
    }

    function openDlg(idx, day) {
      currentDlgIdx = idx;
      var ex = getExercises(day)[idx];
      var img = IMGS[ex.muscle] || IMGS['Full Body'];

      document.getElementById('dlgImg').src = img;
      document.getElementById('dlgMuscle').textContent = ex.muscle;
      document.getElementById('dlgName').textContent = ex.name;
      document.getElementById('dlgMeta').textContent = ex.sets + '  ·  ~' + ex.cal + ' kcal  ·  ' + INT.rest;

      var sh = '';
      ex.steps.forEach(function (s, i) { sh += '<div class="step"><div class="step-n">' + (i + 1) + '</div><div class="step-t">' + s + '</div></div>'; });
      document.getElementById('dlgSteps').innerHTML = sh;

      var th = '';
      ex.tips.forEach(function (t) { th += '<div class="tip"><span class="tip-ic">⚡</span>' + t + '</div>'; });
      document.getElementById('dlgTips').innerHTML = th;

      var isDone = completed[day] && completed[day][idx];
      var db = document.getElementById('dlgDoneBtn');
      db.textContent = isDone ? '✅ Completed!' : '✅ Mark Done';
      db.style.opacity = isDone ? '0.5' : '1';
      db.style.pointerEvents = isDone ? 'none' : 'auto';

      document.getElementById('overlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function markDoneFromDlg() {
      if (currentDlgIdx < 0) return;
      toggleDone({ stopPropagation: function () { } }, currentDlgIdx, activeDay);
      closeOverlay();
    }

    function closeOverlay() {
      document.getElementById('overlay').classList.remove('open');
      document.body.style.overflow = '';
      currentDlgIdx = -1;
    }

    function closeDlg(e) { if (e.target === document.getElementById('overlay')) closeOverlay(); }
  </script>
</body>

</html>
